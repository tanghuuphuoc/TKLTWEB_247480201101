<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The position Property</title>
</head>
<body>
    <!DOCTYPE html>
<html>
<head>
<style>
div.static {
  position: static;
  border: 3px solid #5221ad;
}
</style>
</head>
<body>

<h2>Using position: static;</h2>

<p>An element with position: static; is always positioned according to the normal flow of the page:</p>

<div class="static">
This div element has position: static;
</div>
</body>
</html>
