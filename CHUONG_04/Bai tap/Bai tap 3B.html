<html lang="en">
<head>
  <meta charset="UTF-8">

  <HTML>
    <HEAD> </HEAD>
    <BODY>
        <script language="JavaScript">
            // Hàm hiển thị thông báo theo yêu cầu
            function HienThiThongBao() {
                alert("Hello Everybody, I am studying web design with Javascript");
            }
        </script>
        <form>
            <!-- Textbox có name là msg03, value là "Hello Everybody" -->
            <input type="text" name="msg03" value="Hello Everybody" size="30">
            <br><br>
            
            <!-- Nút nhấn có name là Hello, value là Hello -->
            <!-- Khi click sẽ gọi hàm HienThiThongBao() -->
            <input type="button" name="Hello" value="Hello" onclick="HienThiThongBao()">
        </form>
    </BODY>
    </HTML>
