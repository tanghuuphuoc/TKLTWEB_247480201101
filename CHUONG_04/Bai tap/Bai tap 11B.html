<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
 <HTML>
<HEAD>
    <TITLE>Thay đổi màu nền bằng click chuột</TITLE>
    <META http-equiv="Content-Type" content="text/html; charset=utf-8">
</HEAD>
<BODY>
    <h2>Thay đổi màu nền sử dụng đối tượng document</h2>
    <!-- Nút 1: Đổi màu xanh dương -->
    <INPUT type="button" name="Mau xanh dương" value="Màu xanh dương" 
    onClick="document.bgColor = 'blue' ">
    <!-- Nút 2: Đổi màu xanh lá -->
    <INPUT type="button" name="Mau xanh lá" value="Màu xanh lá" 
    onClick="document.bgColor = 'green' ">

    <!-- Nút 3: Đổi màu vàng -->
    <INPUT type="button" name="Mau vàng" value="Màu vàng" 
    onClick="document.bgColor = 'yellow' ">
</BODY>
</HTML>
